<text x="24" y="478" fill="#e6edf3" font-size="13" text-anchor="start" font-weight="normal">VOUT = 1.0 V x (1 + R1 / (R2 + R3))</text>
<text x="24" y="498" fill="#9fb3c8" font-size="12" text-anchor="start" font-weight="normal">EN: leave open = on (R4).  Pull to GND = off.  R5 sets a turn-on voltage: VON = 1.231 V x (1 + R4 / R5).</text>
<text x="24" y="516" fill="#9fb3c8" font-size="12" text-anchor="start" font-weight="normal">PG: open-drain, low = fault.  Pull up to 18 V max (or use an MCU pin's internal pull-up).</text>
<text x="24" y="534" fill="#9fb3c8" font-size="12" text-anchor="start" font-weight="normal">Keep VIN above VOUT; 24 V out needs 28-36 V in (C6-C9 then 4x 10u 50V).</text>
