<!doctype html><html><head><meta charset="utf-8"><style>
/* Fonts: embed the @font-face block from lr4-hardware-checklist.html here before rendering. */
html, body { margin: 0; background: #0b0d0c; }
.icon { position: relative; width: 1024px; height: 1024px; overflow: hidden; background: #0b0d0c; }
/* faint drafting grid, like a machine bed */
.grid { position: absolute; inset: 0; background-image:
  linear-gradient(#7fff00 1px, transparent 1px), linear-gradient(90deg, #7fff00 1px, transparent 1px);
  background-size: 64px 64px; opacity: .05; }
/* the panel: 45-degree cut corners, steel frame */
.frame { position: absolute; left: 132px; top: 132px; width: 760px; height: 760px; background: #2f3537;
  clip-path: polygon(72px 0, 100% 0, 100% calc(100% - 72px), calc(100% - 72px) 100%, 0 100%, 0 72px); }
.frame > div { position: absolute; inset: 8px; background: #16191a;
  clip-path: polygon(69px 0, 100% 0, 100% calc(100% - 69px), calc(100% - 69px) 100%, 0 100%, 0 69px); }
.lr4 { position: absolute; left: 196px; top: 168px; font: 700 250px/1 Oswald, sans-serif; letter-spacing: 8px; color: #7fff00;
  text-shadow: 0 0 28px rgba(127,255,0,.45); }
.rows { position: absolute; left: 204px; top: 520px; display: flex; flex-direction: column; gap: 52px; }
.row { display: flex; align-items: center; gap: 44px; }
.box { width: 92px; height: 92px; box-sizing: border-box; border: 12px solid #7fff00; background: #7fff00; display: grid; place-items: center; }
.box svg { width: 70px; height: 70px; fill: none; stroke: #0b0d0c; stroke-width: 4.2; stroke-linecap: square; }
.box.open { background: transparent; border-color: #646b6e; }
.bar { height: 26px; background: #c8cdd0; }
.open + .bar { background: #646b6e; }
</style></head><body>
<div class="icon" id="icon">
  <div class="grid"></div>
  <div class="frame"><div></div></div>
  <div class="lr4">LR4</div>
  <div class="rows">
    <div class="row"><div class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="bar" style="width:380px"></div></div>
    <div class="row"><div class="box open"></div><div class="bar" style="width:300px"></div></div>
  </div>
</div>
</body></html>
