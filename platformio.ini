; PlatformIO build for the LED task lamp (QT Py RP2040, arduino-pico core).
; Arduino IDE users: open firmware/TaskLamp/TaskLamp.ino instead (see README).

[platformio]
src_dir = firmware/TaskLamp
default_envs = qtpy_rp2040

[env:qtpy_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_qtpy
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
lib_deps =
    adafruit/Adafruit seesaw Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
build_flags =
    -Wall
monitor_speed = 115200
